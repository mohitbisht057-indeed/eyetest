<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acuity Vision Chart</title>
<style>
  :root{
    --bg-1: #0a0e17;
    --bg-2: #0f1830;
    --accent: #4fd1ff;
    --accent-2: #8b7bff;
    --text: #eaf2ff;
    --text-dim: #7f8ca3;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    background: var(--bg-1);
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    position:relative;
  }

  /* Animated gradient background */
  .bg{
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(79,209,255,0.12), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(139,123,255,0.14), transparent 45%),
      linear-gradient(135deg, var(--bg-1), var(--bg-2));
    background-size: 200% 200%;
    animation: drift 10s ease-in-out infinite;
    z-index:0;
  }

  @keyframes drift{
    0%   { background-position: 0% 0%; }
    50%  { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
  }

  /* Faint concentric rings, echoing an eye chart / focus target */
  .rings{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:0;
    pointer-events:none;
  }
  .ring{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(79,209,255,0.15);
    animation: pulse 3.6s ease-out infinite;
    opacity:0;
  }
  .ring:nth-child(1){ width:180px; height:180px; animation-delay:0s; }
  .ring:nth-child(2){ width:180px; height:180px; animation-delay:1.2s; }
  .ring:nth-child(3){ width:180px; height:180px; animation-delay:2.4s; }

  @keyframes pulse{
    0%   { width:120px; height:120px; opacity:0.5; }
    70%  { opacity:0; }
    100% { width:520px; height:520px; opacity:0; }
  }

  .loader{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    opacity:0;
    animation: rise 0.9s cubic-bezier(.22,1,.36,1) forwards 0.15s;
  }

  @keyframes rise{
    0%   { opacity:0; transform: translateY(18px) scale(0.96); }
    100% { opacity:1; transform: translateY(0) scale(1); }
  }

  .icon-wrap{
    position:relative;
    width:120px;
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .icon-glow{
    position:absolute;
    inset:-20px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(79,209,255,0.35), transparent 70%);
    filter: blur(10px);
    animation: breathe 2.4s ease-in-out infinite;
  }

  @keyframes breathe{
    0%, 100% { transform: scale(0.9); opacity:0.6; }
    50%      { transform: scale(1.12); opacity:1; }
  }

  .icon-ring{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:2px solid transparent;
    border-top-color: var(--accent);
    border-right-color: var(--accent-2);
    animation: spin 1.4s linear infinite;
  }

  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  #icon{
    width:76px;
    height:76px;
    object-fit:contain;
    border-radius:18px;
    position:relative;
    z-index:2;
    animation: float 3s ease-in-out infinite;
    box-shadow: 0 0 30px rgba(79,209,255,0.25);
    background: rgba(255,255,255,0.03);
  }

  @keyframes float{
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }

  .brand-text{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.08em;
    color:var(--text);
    display:flex;
    gap:1px;
  }

  .brand-text span{
    display:inline-block;
    opacity:0;
    animation: letterIn 0.5s ease forwards;
    background: linear-gradient(180deg, var(--text), var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  @keyframes letterIn{
    0%   { opacity:0; transform: translateY(10px); filter: blur(4px); }
    100% { opacity:1; transform: translateY(0); filter: blur(0); }
  }

  .subtext{
    font-size:12px;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color: var(--text-dim);
    opacity:0;
    animation: fadeIn 0.8s ease forwards 1.1s;
  }

  @keyframes fadeIn{
    to{ opacity:1; }
  }

  .progress{
    width:180px;
    height:3px;
    border-radius:3px;
    background: rgba(255,255,255,0.08);
    overflow:hidden;
    margin-top:4px;
  }

  .progress-bar{
    height:100%;
    width:0%;
    border-radius:3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    animation: load 1.3s ease forwards 0.5s;
    box-shadow: 0 0 8px rgba(79,209,255,0.6);
  }

  @keyframes load{
    to{ width:100%; }
  }

  /* Exit transition overlay */
  .exit-veil{
    position:fixed;
    inset:0;
    background: var(--bg-1);
    z-index:10;
    opacity:0;
    pointer-events:none;
  }

  body.leaving .exit-veil{
    animation: veilIn 0.6s ease forwards;
  }

  body.leaving .loader{
    animation: sink 0.6s ease forwards;
  }

  @keyframes sink{
    to{ opacity:0; transform: translateY(-14px) scale(0.97); filter: blur(6px); }
  }

  @keyframes veilIn{
    to{ opacity:1; }
  }

  .fallback{
    z-index:1;
    margin-top:18px;
    font-size:12px;
    color: var(--text-dim);
    opacity:0;
    animation: fadeIn 0.6s ease forwards 2.2s;
  }
  .fallback a{
    color: var(--accent);
    text-decoration:none;
  }
  .fallback a:hover{ text-decoration:underline; }
</style>
</head>
<body>

  <div class="bg"></div>
  <div class="rings">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>
  <div class="exit-veil"></div>

  <div class="loader">
    <div class="icon-wrap">
      <div class="icon-glow"></div>
      <div class="icon-ring"></div>
      <img id="icon" src="icon.png" alt="Acuity Vision Chart icon"
           onerror="this.style.display='none'">
    </div>

    <div class="brand">
      <div class="brand-text" id="brandText"></div>
      <div class="subtext">Loading experience</div>
      <div class="progress"><div class="progress-bar"></div></div>
    </div>

    <div class="fallback">
      Taking a while? <a href="ACUITY-VISION-CHART-New-mark3/index.html">Open it directly</a>
    </div>
  </div>

<script>
  // Animate the brand text letter by letter
  const text = "ACUITY-VISION-CHART";
  const el = document.getElementById('brandText');
  [...text].forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (0.05 * i) + 's';
    el.appendChild(span);
  });

  const DEST = "ACUITY-VISION-CHART-New-mark3/index.html";

  // Trigger exit transition, then navigate
  function goToDestination(){
    document.body.classList.add('leaving');
    setTimeout(() => { window.location.href = DEST; }, 620);
  }

  // Total time on the loading screen before redirect
  setTimeout(goToDestination, 2200);
</script>

</body>
</html>
